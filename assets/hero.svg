    <path d="M1172 88 V28 H1112" stroke="#D62F79" opacity="0.95"/>
    <path d="M28 372 V432 H88" stroke="#D62F79" opacity="0.95"/>
    <path d="M1172 372 V432 H1112" stroke="#00E5FF" opacity="0.95"/>
    <path d="M110 28 H220" stroke="#00E5FF" opacity="0.35"/>
    <path d="M980 28 H1090" stroke="#D62F79" opacity="0.35"/>
    <path d="M110 432 H220" stroke="#D62F79" opacity="0.35"/>
    <path d="M980 432 H1090" stroke="#00E5FF" opacity="0.35"/>
  </g>

  <g stroke="#00E5FF" stroke-width="1" opacity="0.5">
