<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Vadim Kulyba - Team / Tech Lead">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0a0520"/>
      <stop offset="100%" stop-color="#12001a"/>
    </linearGradient>
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#D62F79"/>
      <stop offset="75%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#D62F79" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D62F79" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowM" cx="38%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#D62F79" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D62F79" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="62%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00E5FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#glowM)"/>
  <rect width="1200" height="460" fill="url(#glowC)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>

  <g opacity="0.7">
