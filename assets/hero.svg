    <line x1="600" y1="280" x2="600" y2="460" stroke="#00E5FF" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="520" y1="280" x2="340" y2="460" stroke="#00E5FF" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="680" y1="280" x2="860" y2="460" stroke="#00E5FF" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="440" y1="280" x2="120" y2="460" stroke="#D62F79" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="760" y1="280" x2="1080" y2="460" stroke="#D62F79" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="360" y1="280" x2="-40" y2="460" stroke="#00E5FF" stroke-opacity="0.14" stroke-width="1"/>
