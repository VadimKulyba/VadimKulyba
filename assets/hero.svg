  <text x="606" y="128" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="3" fill="#00E5FF" opacity="0.35">VADIM KULYBA</text>
  <text x="594" y="122" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="3" fill="#D62F79" opacity="0.45">VADIM KULYBA</text>
  <text x="600" y="125" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="3" fill="#F5FBFF">VADIM KULYBA</text>

  <rect x="300" y="150" width="600" height="3" fill="url(#neonBar)"/>

  <text x="600" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" letter-spacing="8" fill="#D62F79">TEAM / TECH LEAD</text>

  <text x="600" y="245" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" letter-spacing="1.5" fill="#8BE9FD" opacity="0.95">TravelTech  |  Booking Systems  |  B2B</text>
  <text x="600" y="275" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" letter-spacing="1.5" fill="#8BE9FD" opacity="0.95">FinTech  |  Oil &amp; Gas  |  E-Commerce</text>

  <text x="600" y="415" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="700" letter-spacing="6" fill="#00E5FF">9+ YEARS</text>

