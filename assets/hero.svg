    <line x1="28" y1="170" x2="40" y2="170"/>
    <line x1="28" y1="200" x2="48" y2="200"/>
    <line x1="28" y1="230" x2="40" y2="230"/>
    <line x1="1152" y1="140" x2="1172" y2="140"/>
